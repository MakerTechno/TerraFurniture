name: Build

on: [push, pull_request]

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: "gradle"

      - name: Generate assets
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: runData -Pdev=false

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build -Pdev=false

      - name: Make scripts executable
        run: chmod +x .github/workflows/scripts/*.sh

      - name: Extract mod_version and check if tag exists
        id: version
        run: .github/workflows/scripts/extract_version.sh

      # Test release (accepting test branch)
      - name: Create test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          automatic_release_tag: test-${{ steps.version.outputs.mod_version }}
          prerelease: true
          title: "TerraFurniture Test Build ${{ steps.version.outputs.mod_version }}"
          files: ./build/libs/*.jar
          body: |
            ### Changes since last version
            ${{ steps.version.outputs.changelog }}

      # Official release (only master/main branch)
      - name: Create official release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          automatic_release_tag: ${{ steps.version.outputs.mod_version }}
          prerelease: false
          title: "TerraFurniture Build(TestOnly) ${{ steps.version.outputs.mod_version }}"
          files: ./build/libs/*.jar
          body: |
            ### Changes since last version
            ${{ steps.version.outputs.changelog }}

      # Latest build (master/main/test)
      - name: Always update latest build
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) || (github.event_name == 'push' && github.ref == 'refs/heads/test')
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GH_TOKEN }}
          automatic_release_tag: latest-build
          prerelease: true
          title: "TerraFurniture Latest Build"
          files: ./build/libs/*.jar
